[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperopenclaw"
version = "1.0.0"
description = "PaperOpenClaw - OpenClaw-style agentic research paper knowledge base (RAG pyramid + fishbone knowledge graph)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "PaperOpenClaw" }]
keywords = ["rag", "knowledge-graph", "pdf", "agents", "okf"]

dependencies = [
    "fastapi>=0.104,<1.0",
    "uvicorn>=0.24,<1.0",
    "pydantic>=2.5,<3.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27,<1.0",
    "PyMuPDF>=1.24,<2.0",
    "Pillow>=10.0",
    "numpy>=1.24",
    "chromadb>=0.5",
    "jieba>=0.42",
    "networkx>=3.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Local embedding models. Without these the app falls back to a remote
# /embeddings endpoint, then to the offline lexical provider, so they are
# optional by design (NFR-6).
local-embed = ["transformers>=4.35", "torch>=2.0"]
# Native desktop window (pywebview). The desktop entry point falls back to
# opening the browser when no webview engine is available.
desktop = ["pywebview>=4.0"]
dev = ["pytest>=7.0"]

[project.scripts]
paperopenclaw = "paperopenclaw.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["paperopenclaw*"]

[tool.setuptools.package-data]
paperopenclaw = ["storage/*.sql"]
